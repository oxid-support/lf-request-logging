services:
  _defaults:
    public: false
    autowire: true

  # graphql-base does not alias the GraphQLite interface to its concrete
  # Authentication service, so autowire cannot resolve it. Alias it locally.
  TheCodingMachine\GraphQLite\Security\AuthenticationServiceInterface:
    alias: OxidEsales\GraphQL\Base\Service\Authentication

  # Service Layer
  OxidSupport\Heartbeat\Component\ApiVersion\Service\ApiVersionServiceInterface:
    class: OxidSupport\Heartbeat\Component\ApiVersion\Service\ApiVersionService
    public: true

  # Controller - GraphQL
  OxidSupport\Heartbeat\Component\ApiVersion\Controller\GraphQL\ApiVersionController:
    public: true

  # Framework (GraphQL)
  OxidSupport\Heartbeat\Component\ApiVersion\Framework\NamespaceMapper:
    tags: ['graphql_namespace_mapper']

  OxidSupport\Heartbeat\Component\ApiVersion\Framework\PermissionProvider:
    public: true
    tags: ['graphql_permission_provider']
