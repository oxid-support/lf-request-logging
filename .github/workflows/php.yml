name: PHP Composer

on:
  push:
    branches: [ "b-7.1.x" ]
  pull_request:
    branches: [ "b-7.1.x" ]

permissions:
  contents: read

jobs:
  phpcompatibility:
    name: PHP Compatibility Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Install PHPCompatibility (global, lightweight)
      run: |
        composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
        composer global require --no-progress \
          squizlabs/php_codesniffer:^4 \
          phpcompatibility/php-compatibility:dev-develop \
          dealerdirect/phpcodesniffer-composer-installer

    - name: Run PHP Compatibility check
      run: ~/.composer/vendor/bin/phpcs --standard=tests/phpcompat.xml -p

  build:
    name: build (OXID 7.1)
    needs: phpcompatibility
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # OXID 7.1 line runs on PHP 8.2-8.3 (the maintained 7.1.1 stack needs 8.2+;
        # 7.1.x does not install on 8.4/8.5). Other lines (7.2-7.5) are placeholders.
        php-version: ['8.2', '8.3']

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}

    - name: PHP Lint
      run: find src/ -name '*.php' -print0 | xargs -0 -n1 php -l

    - name: Validate composer.json
      run: composer validate --strict

    - name: Constrain to the OXID 7.1 line
      # composer.json stays loose (7.1-7.5); the build pins the 7.1 line here so
      # this job really exercises OXID 7.1 instead of resolving the latest in range.
      run: composer require --no-update oxid-esales/oxideshop-ce:'~7.1.0' oxid-esales/graphql-base:'^9.0'

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v5
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-oxid7.1-${{ hashFiles('**/composer.json') }}

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress

    - name: Run static tests suite
      run: composer run-script static
    - name: Run Unit Tests
      run: composer run-script tests-unit

  psalm-taint-analysis:
    name: Psalm Taint Analysis
    needs: phpcompatibility
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Cache Composer packages
      uses: actions/cache@v5
      with:
        path: vendor
        key: ${{ runner.os }}-php-8.2-${{ hashFiles('**/composer.json') }}

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Download Psalm PHAR
      run: curl -fsSL https://github.com/vimeo/psalm/releases/latest/download/psalm.phar -o psalm.phar

    - name: Run Psalm Taint Analysis
      run: php psalm.phar --taint-analysis

  # Placeholder jobs: b-7.1.x is compatible with OXID 7.1 through 7.5. OXID 7.1 is
  # really built above; 7.2-7.5 are not exercised yet. These dummy jobs make the
  # planned coverage visible now and will be replaced with real per-version
  # build/test steps once implemented.
  oxid-compatibility:
    name: OXID compatibility (planned)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        oxid: ['7.2', '7.3', '7.4', '7.5']
    steps:
      - run: echo "OXID ${{ matrix.oxid }} compatibility check is planned (placeholder, not yet implemented)"

  notify-devops:
    name: Notify DevOps Repo
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/b-7.1.x'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger submodule update in devops repo
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.GH_PAT }}
          repository: oxid-support/heartbeat_project_devops
          event-type: submodule-updated
          client-payload: '{"component": "module", "sha": "${{ github.sha }}", "ref": "${{ github.ref_name }}"}'
